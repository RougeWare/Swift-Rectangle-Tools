name: macOS

on: [pull_request]

jobs:
  build:

    timeout-minutes: 2
    runs-on: macOS-latest

    steps:
    - name: Set up Swift 6
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: '6.0'
        
    - name: Swift version
      run: swift --version
        
    - uses: actions/checkout@v3
    
    - name: Build
      run: swift build -v
      
    - name: Run tests
      run: swift test -v
